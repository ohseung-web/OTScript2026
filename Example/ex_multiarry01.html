<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2차원 배열</title>
  </head>
  <body>
    <script>
      // 1. 3행 3열 2차원 배열 생성 (기본값 0으로 채우기)
      // const arryM01 = Array.from(Array(3), () => new Array(3).fill(0));

      // 2. forEach를 활용해 대각선 위치(index, index)를 1로 변경
      // arryM01.forEach((row, index) => {
      //   row[index] = 1;
      // });

      // 3. 콘솔에 각 행 출력
      // arryM01.forEach((row) => {
      //   console.log(row);
      // });

      // 1. 기본값 0으로 채워진 3행 3열 2차원 배열 생성
      const baseArray = Array.from(Array(3), () => new Array(3).fill(0));

      // 2. map을 활용해 새로운 대각선 배열 생성
      const arryM01 = baseArray.map((row, index) => {
        // 1. 행(row)을 수정하고
        row[index] = 1; // 대각선 위치에 1 대입
        // 2. "수정된 이 row를 새 배열의 재료로 제출할게!"
        return row; // 변경된 행을 반환
      });

      // map의 return은 "각 순회마다 만들어낸 결과물을
      // 새로운 상자에 담아 모으는 표"입니다.
      // return을 써주지 않으면 함수는 기본적으로 undefined를
      // 반환하기 때문에,
      // map은 undefined 3개를 모아서
      // [undefined, undefined, undefined]를 만들어 버립니다.
      console.log(arryM01);

      // 3. 콘솔 출력
      arryM01.forEach((row) => {
        console.log(row);
      });

      // 1. 2행 4열 2차원 배열 생성
      const arrM02 = Array.from(Array(2), () => new Array(4).fill(0));

      // 1부터 증가시킬 카운터 변수
      let num = 1;

      // 2. 바깥쪽 forEach: 행(row) 순회
      arrM02.forEach((row) => {
        // 3. 안쪽 forEach: 각 행 안의 열(element) 순회
        row.forEach((_, cIndex) => {
          row[cIndex] = num; // 현재 위치에 1~8 채우기
          num++; // 숫자 1 증가
        });

        // 콘솔에 해당 행 출력
        console.log(row);
        console.log(arrM02);
      });
    </script>
  </body>
</html>
