<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kioskCafe</title>
    <link rel="stylesheet" href="kioskCafe-2026-filter.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="order_menu">
        <h2>원하시는 음료를 선택해 주세요</h2>
        <p>Please choose the drink you want.</p>

        <div class="section1">
          <h2>MENU</h2>

          <!-- 메뉴 카테고리 필터 추가 -->
          <div class="menu-filter">
            <button
              type="button"
              class="filter-btn active"
              onclick="filterMenu('전체', this)"
            >
              전체
            </button>
            <button
              type="button"
              class="filter-btn"
              onclick="filterMenu('커피', this)"
            >
              커피
            </button>
            <button
              type="button"
              class="filter-btn"
              onclick="filterMenu('음료', this)"
            >
              음료
            </button>
          </div>

          <div class="menubox"></div>
        </div>
      </div>

      <div class="order_list">
        <div class="section2">
          <h2>주문내역</h2>
          <div class="orderbox"></div>
        </div>
      </div>

      <div class="order_result">
        <h2>총 주문금액 : <span class="pay">0원</span></h2>
        <span class="line">&boxv;</span>
        <button class="btn">현금결제</button>
      </div>
    </div>

    <script>
      let menus = [
        { id: 0, name: '아메리카노', type: 'HOT', price: 1000, quantity: 1 },
        { id: 1, name: '아메리카노', type: 'ICE', price: 1300, quantity: 1 },
        { id: 2, name: '바닐라라떼', type: 'HOT', price: 2500, quantity: 1 },
        { id: 3, name: '바닐라라떼', type: 'ICE', price: 2800, quantity: 1 },
        { id: 4, name: '연유라떼', type: 'HOT', price: 2500, quantity: 1 },
        { id: 5, name: '연유라떼', type: 'ICE', price: 2800, quantity: 1 },
        {
          id: 6,
          name: '카라멜마끼아또',
          type: 'HOT',
          price: 2800,
          quantity: 1,
        },
        {
          id: 7,
          name: '카라멜마끼아또',
          type: 'ICE',
          price: 3000,
          quantity: 1,
        },
        { id: 8, name: '카페모카', type: 'HOT', price: 3000, quantity: 1 },
        { id: 9, name: '카페모카', type: 'ICE', price: 3300, quantity: 1 },
        { id: 10, name: '딥카페라테', type: 'HOT', price: 3400, quantity: 1 },
        { id: 11, name: '딥카페라테', type: 'ICE', price: 3700, quantity: 1 },

        // 음료 메뉴 추가
        {
          id: 12,
          name: '레몬에이드',
          type: 'ICE',
          price: 2500,
          quantity: 1,
          category: '음료',
        },
        {
          id: 13,
          name: '자몽에이드',
          type: 'ICE',
          price: 2800,
          quantity: 1,
          category: '음료',
        },
        {
          id: 14,
          name: '복숭아아이스티',
          type: 'ICE',
          price: 2200,
          quantity: 1,
          category: '음료',
        },
        {
          id: 15,
          name: '초코라떼',
          type: 'HOT',
          price: 3000,
          quantity: 1,
          category: '음료',
        },
        {
          id: 16,
          name: '딸기라떼',
          type: 'ICE',
          price: 3500,
          quantity: 1,
          category: '음료',
        },
      ];

      // Array와 Object를 이용하여 kiosk 상품주문 하기 만들기
      // 1. menubox에 상품 출력하는 함수 작성 - menuList()
      // 2. menubox에서 클릭한 상품을 orderbox에 출력하는 함수 작성
      // 3. plus 버튼 클릭시 수량과 금액이 증가하는 함수 - plus()
      // 4. minus 버튼 클릭시 수량과 금액이 감소하는 함수 - minus()
      // 5. delete 버튼 클릭시 상품을 삭제하는 함수 - remove()
      // 6. 주문한 총금액을 출력하는 함수 - totalMoney()

      let menubox = document.querySelector('.menubox');
      let orderbox = document.querySelector('.orderbox');
      let pay = document.querySelector('.pay');
      let orderlist = document.querySelectorAll('.orderlist');
      let orderListArr = [];

      // 현재 선택한 카테고리
      let currentCategory = '전체';

      // 메뉴 카테고리 필터 함수
      function filterMenu(category, btn) {
        currentCategory = category;

        // 모든 버튼에서 active 클래스 제거
        document.querySelectorAll('.filter-btn').forEach((button) => {
          button.classList.remove('active');
        });

        // 클릭한 버튼에 active 클래스 추가
        btn.classList.add('active');

        // 선택한 카테고리의 메뉴 출력
        menuList();
      }

      // menubox에 상품 출력하는 함수
      function menuList() {
        let menuslist = '<ul>';

        // filter()를 사용하여 카테고리별 메뉴 추출
        let filteredMenus = menus.filter((menu) => {
          // category가 없는 기존 상품은 커피로 처리
          let category = menu.category || '커피';

          // 전체이거나 선택한 카테고리와 일치하면 true
          return currentCategory === '전체' || category === currentCategory;
        });

        // 필터링된 상품만 화면에 출력
        for (let i = 0; i < filteredMenus.length; i++) {
          // 필터링된 배열의 인덱스가 아니라
          // 원본 menus 배열의 인덱스를 사용
          let originalIndex = menus.indexOf(filteredMenus[i]);

          if (filteredMenus[i].type === 'HOT') {
            menuslist += `<li class="hot" onclick="orderList(${originalIndex})"`;
          } else {
            menuslist += `<li class="ice" onclick="orderList(${originalIndex})"`;
          }

          menuslist += `>
            <i></i>
            <span>${filteredMenus[i].type}</span>
            <strong>${filteredMenus[i].name}</strong>
            <em>${filteredMenus[i].price.toLocaleString('ko-KR')}원</em>
          </li>`;
        }

        menuslist += '</ul>';
        menubox.innerHTML = menuslist;
      }

      // 상품을 메뉴 화면에 출력하기 위해 menuList() 호출
      menuList();

      // orderList()함수를 작성하여 주문한 상품을 출력한다.
      function orderList(orderIndex) {
        // 한번 선택한 상품을 재선택하면 수량만 증가
        let check = -1;

        for (let j = 0; j < orderListArr.length; j++) {
          if (orderListArr[j].id === menus[orderIndex].id) {
            check = j;
            break;
          }
        }

        // 기존 상품이 존재하면 수량만 증가
        if (check > -1) {
          orderListArr[check].quantity++;

          // 수량과 가격 갱신
          updateOrder(check);

          // 총금액 갱신
          totalMoney();
        } else {
          // 주문한 상품이 없을 때
          insertOrder(orderIndex);
        }
      }

      // 주문한 상품을 orderListArr[] 배열에 삽입하는 함수
      function insertOrder(orderIndex) {
        orderListArr.push({
          id: menus[orderIndex].id,
          name: menus[orderIndex].name,
          type: menus[orderIndex].type,
          price: menus[orderIndex].price,
          quantity: menus[orderIndex].quantity,
          category: menus[orderIndex].category || '커피',
        });

        orderlistDisplay();
        totalMoney();
      }

      // 주문한 상품을 orderbox에 출력하는 함수
      function orderlistDisplay() {
        orderbox.innerHTML = '';

        for (let i = 0; i < orderListArr.length; i++) {
          orderbox.innerHTML += `
            <div class="orderlist" listindex="${i}">
              <p>
                ${orderListArr[i].name}(${orderListArr[i].type})
                <em emindex="${i}">${orderListArr[i].quantity}</em>개,
                <span spanindex="${i}">
                  ${(
                    orderListArr[i].quantity * orderListArr[i].price
                  ).toLocaleString('ko-KR')}
                </span>원
              </p>

              <button type="button" onclick="minus(${i});">-</button>
              <button type="button" onclick="plus(${i});">+</button>
              <button type="button" onclick="remove(${i});">x</button>
            </div>
          `;
        }
      }

      // plus 버튼
      function plus(orderIndex) {
        orderListArr[orderIndex].quantity++;
        updateOrder(orderIndex);
        totalMoney();
      }

      // minus 버튼
      function minus(orderIndex) {
        if (orderListArr[orderIndex].quantity > 1) {
          orderListArr[orderIndex].quantity--;
          updateOrder(orderIndex);
        } else {
          alert('수량은 1개까지 가능합니다.');
        }

        totalMoney();
      }

      // 수량과 가격을 갱신하는 updateOrder() 함수
      function updateOrder(orderIndex) {
        let quantEm = document.querySelector(`em[emindex="${orderIndex}"]`);

        let priceSpan = document.querySelector(
          `span[spanindex="${orderIndex}"]`,
        );

        quantEm.textContent = orderListArr[orderIndex].quantity;

        priceSpan.textContent = (
          orderListArr[orderIndex].quantity * orderListArr[orderIndex].price
        ).toLocaleString('ko-KR');
      }

      // x 버튼을 클릭하면 상품을 삭제하는 remove() 함수
      function remove(orderIndex) {
        let result = confirm('정말 삭제하시겠습니까?');

        if (result === true) {
          orderListArr.splice(orderIndex, 1);
          orderlistDisplay();
          totalMoney();
        }

        // orderListArr.splice(orderIndex, 1);
        // orderlistDisplay();
        // totalMoney();
      }

      // 총금액을 구하는 totalMoney() 함수
      function totalMoney() {
        let totalMoney = 0;

        for (let i = 0; i < orderListArr.length; i++) {
          totalMoney += orderListArr[i].quantity * orderListArr[i].price;
        }

        pay.textContent = totalMoney.toLocaleString('ko-KR') + '원';
      }
    </script>
  </body>
</html>
