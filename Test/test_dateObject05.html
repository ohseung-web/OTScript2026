<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코어객체</title>
  </head>
  <body>
    <h3>Date 객체로 현재 시간 알아내기</h3>
    <hr />

    <script>
      // document.write()는 웹 브라우저가 HTML 문서(페이지)를 로딩하고 파싱할 때, 
      // 해당 위치에 원하는 텍스트나 HTML 태그를 직접 출력(인쇄)해주는 메서드이다.
      // HTML 태그 파싱: 단순히 글자만 적는 것이 아니라 <br>, <h3>, <hr /> 같은 
      // HTML 태그를 문자열로 전달하면 브라우저가 이를 실제 HTML 요소로 해석하여 화면에 그려준다.

      let now = new Date(); // 현재 시간 값을 가진 Date 객체 생성
      let weekString = ['일', '월', '화', '수', '목', '금', '토'];

      document.write(now.getFullYear() + '년도 <br>');
      document.write(now.getMonth() + 1 + '월 <br>');
      document.write(now.getDate() + '일 <br>');

      let week = now.getDay();
      for (let i = 0; i < weekString.length; i++) {
        if (week === i) {
          document.write(weekString[i] + '요일 <br>');
        }
      }

      document.write(now.getHours() + '시 <br>');
      document.write(now.getMinutes() + '분 <br>');
      document.write(now.getSeconds() + '초 <br>');
      document.write(now.getMilliseconds() + '밀리초 <br><hr>');

      document.write(`toLocaleDateString : ${now.toLocaleDateString()} <br>`);
      document.write(`toLocaleTimeString : ${now.toLocaleTimeString()}`);
    </script>
  </body>
</html>
