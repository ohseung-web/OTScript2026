<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>함수02</title>
  </head>
  <body>
    <script>
      function sayHello() {
        return 'Hello,';
      }
      function greeting(helloMessage, name) {
        console.log(helloMessage() + name);
      } // 'sayHello()'를 greeting함수에 인자로 전달 함 => 일급함수
      greeting(sayHello, 'javaScript');

      hap();
      function hap() {
        //선언적 함수
        console.log('hap');
      }

      const minus = function (a = 1, b = 2) {
        //익명함수
        const num1 = 2;
        const num2 = 1;
        document.write(num1 + num2);
        document.write('<br />');
        document.write(a + b);
      };
      minus(5, 7);
    </script>
  </body>
</html>
