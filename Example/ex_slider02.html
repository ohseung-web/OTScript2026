<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>슬라이드 연습문제</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      body {
        background: #f0f0f0;
      }
      h1 {
        text-align: center;
        padding: 20px 0;
        color: #333;
      }

      /* 삼지창 버튼 스타일 */
      #menuBtn {
        font-size: 28px;
        cursor: pointer;
        position: fixed;
        top: 20px;
        left: 20px; /* 왼쪽으로 이동 */
        z-index: 1001;
        background: #333;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 5px;
        transition: 0.3s;
      }
      #menuBtn:hover {
        background: #555;
      }

      /* 메뉴 기본 상태: 왼쪽 화면 밖, 회색 배경 */
      #menu {
        position: fixed;
        top: 0;
        left: -300px; /* 화면 밖 */
        width: 250px;
        height: 100%;
        background: #555; /* 진한 회색으로 변경 */
        color: white;
        padding: 50px 20px;
        box-shadow: 3px 0 15px rgba(0, 0, 0, 0.3);
        border-radius: 0 8px 8px 0;
        transition: 0.3s;
        z-index: 1000;
      }
      #menu ul {
        list-style: none;
        margin-top: 50px;
      }
      #menu li {
        margin: 20px 0;
      }
      #menu li a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        padding: 8px 12px;
        display: block;
        border-radius: 5px;
        transition: 0.3s;
      }
      #menu li a:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* 메뉴 활성화 */
      #menu.active {
        left: 0; /* 화면 안으로 슬라이드 */
      }
    </style>
  </head>
  <body>
    <h1>DOM 실습 - 왼쪽 슬라이드 메뉴</h1>
    <button id="menuBtn">&#x2630;</button>

    <nav id="menu">
      <ul>
        <li><a href="#">홈</a></li>
        <li><a href="#">서비스</a></li>
        <li><a href="#">문의</a></li>
        <li><a href="#">연락처</a></li>
        <li><a href="#">소개</a></li>
      </ul>
    </nav>
    <script>
      // 1. DOM 요소 선택
      const menuBtn = document.getElementById('menuBtn');
      const menu = document.getElementById('menu');

      // 2. 버튼 클릭 시 슬라이드 메뉴 열고 닫기 토글
      menuBtn.addEventListener('click', () => {
        // #menu에 'active' 클래스가 없으면 추가(열림), 있으면 제거(닫힘)
        menu.classList.toggle('active');
      });
    </script>
  </body>
</html>
