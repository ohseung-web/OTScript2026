<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2차원 배열</title>
  </head>
  <body>
    <script>
      // let arr = [
      //   ['a', 'b'],
      //   ['c', 'd'],
      //   ['e', 'f'],
      //   ['g', 'h'],
      //   ['i', 'j'],
      // ];

      let arr01 = new Array(2);
      for (let i = 0; i < arr01.length; i++) {
        arr01[i] = new Array(3);
        for (let j = 0; j < arr01[i].length; j++) {
          arr01[i][j] = 0;
        }
      }

      for (let i = 0; i < arr01.length; i++) {
        for (let j = 0; j < arr01[i].length; j++) {
          // console.log(`2차원 배열: ${arr[i][j]}`);
          console.log(`${[i]}, ${[j]} : ${arr01[i][j]}`);
        }
      }

      // ES6를 지원하는 브라우저이면 아래 방법을 사용하여 2차원 배열을 지정한다.
      // arr02[6][7]
      const arr02 = Array.from(Array(6), () => new Array(7));

      // 값 채우기 예시 : 행 번호 + 열 번호
      for (let i = 0; i < arr02.length; i++) {
        for (let j = 0; j < arr02[i].length; j++) {
          arr02[i][j] = `${i},${j}`;
        }
      }

      // 콘솔에 출력
      for (let i = 0; i < arr02.length; i++) {
        console.log(arr02[i]);
      }

      const arr03 = Array.from(Array(2), () => new Array(3).fill('x'));
      console.log(arr03);
    </script>
  </body>
</html>
