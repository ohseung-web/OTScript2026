<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배열 연습문제</title>
  </head>
  <body>
    <p id="q1"></p>
    <p id="q2"></p>
    <p id="q3"></p>
    <p id="q4"></p>
    <p id="q5"></p>
    <p id="q6"></p>

    <script>
      let numbers = [10, 20, 30, 40, 50];
      let q1 = document.getElementById('q1');
      q1.innerText = '1번 :' + numbers[2];

      let colors = ['red', 'green', 'blue', 'yellow'];
      let q2 = document.getElementById('q2');
      q2.innerText = `2번 : ${colors.slice(0, 2)}`;

      let names = ['Jason', 'Alice', 'Candy', 'Chris'];
      let q3 = document.getElementById('q3');
      let result = '';
      for (let i = 0; i < names.length; i++) {
        result += names[i] + ' ';
      }
      q3.innerText = `3번 : ${result}`;

      let nums = [];
      let q4 = document.getElementById('q4');
      let result01 = '';
      for (let i = 1; i <= 10; i++) {
        nums.push(i);
      }
      for (let i = 0; i < nums.length; i++) {
        if (nums[i] % 2 == 0) result01 += nums[i] + ' ';
      }
      q4.innerText = `4번 : ${result01}`;

      let scores = [90, 75, 88, 60];
      let q5 = document.getElementById('q5');
      let result02 = '';
      for (let i = 0; i < scores.length; i++) {
        if (scores[i] >= 80) result02 += '합격 ';
        else result02 += '불합격 ';
      }
      q5.innerText = `5번 : ${result02}`;

      let temperatures = [32, 25, 28, 35];
      let q6 = document.getElementById('q6');
      let result03 = '';
      for (let i = 0; i < temperatures.length; i++) {
        result03 += temperatures[i] >= 30 ? '더움 ' : '괜찮음 ';
      }
      q6.innerText = `5번 : ${result03}`;
    </script>
  </body>
</html>
