<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>키오스크</title>
    <style>
      .container {
        width: 900px;
        height: 700px;
        margin: 0 auto;
        border: 1px solid red;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="menu-container">
        <div>
          <h6>원하시는 음료를 선택해 주세요</h6>
          <p>please choose the drink you want</p>
          <button class="menu">menu</button>
        </div>
        <ul id="menu"></ul>
      </div>
      <div class="order-container">
        <h4>주문내역</h4>
        <div class="order-list">
          <ul id="orderitem"></ul>
        </div>
      </div>
    </div>
    <script>
      let menu = document.getElementById('menu');
      let orderitem = document.getElementById('orderitem');

      // 1. isOrdered(주문 여부) 상태 플래그만 각 객체에 추가
      let menus = [
        {
          id: 0,
          name: '아메리카노',
          type: 'HOT',
          price: 1000,
          quantity: 1,
          isOrdered: false,
        },
        {
          id: 1,
          name: '아메리카노',
          type: 'ICE',
          price: 1300,
          quantity: 1,
          isOrdered: false,
        },
        {
          id: 2,
          name: '바닐라라떼',
          type: 'HOT',
          price: 2500,
          quantity: 1,
          isOrdered: false,
        },
        {
          id: 3,
          name: '바닐라라떼',
          type: 'ICE',
          price: 2800,
          quantity: 1,
          isOrdered: false,
        },
        {
          id: 4,
          name: '연유라떼',
          type: 'HOT',
          price: 2500,
          quantity: 1,
          isOrdered: false,
        },
        {
          id: 5,
          name: '연유라떼',
          type: 'ICE',
          price: 2800,
          quantity: 1,
          isOrdered: false,
        },
        {
          id: 6,
          name: '카라멜마끼아또',
          type: 'HOT',
          price: 2800,
          quantity: 1,
          isOrdered: false,
        },
        {
          id: 7,
          name: '카라멜마끼아또',
          type: 'ICE',
          price: 3000,
          quantity: 1,
          isOrdered: false,
        },
        {
          id: 8,
          name: '카페모카',
          type: 'HOT',
          price: 3000,
          quantity: 1,
          isOrdered: false,
        },
        {
          id: 9,
          name: '카페모카',
          type: 'ICE',
          price: 3300,
          quantity: 1,
          isOrdered: false,
        },
        {
          id: 10,
          name: '딥카페라테',
          type: 'HOT',
          price: 3400,
          quantity: 1,
          isOrdered: false,
        },
        {
          id: 11,
          name: '딥카페라테',
          type: 'ICE',
          price: 3700,
          quantity: 1,
          isOrdered: false,
        },
      ];

      function render() {
        let result = '';
        for (let i = 0; i < menus.length; i++) {
          result += `<li id="product" onclick="add(${i})">
                        <img src="/images/${i}.png" alt="${menus[i].type}${menus[i].name}">
                        <div class="menu-temp">${menus[i].type}</div>
                        <div class="menu-name">${menus[i].name}</div>
                        <div class="menu-price">${menus[i].price}</div></li>`;
        }
        menu.innerHTML = `${result}`;
      }

      render();

      // 2. renderOder(): 인자를 받지 않고 isOrdered가 true인 메뉴만 순회하여 전체 재생성
      function renderOder() {
        let resultorder = '';
        for (let i = 0; i < menus.length; i++) {
          if (menus[i].isOrdered) {
            let totalprice = menus[i].price * menus[i].quantity;
            resultorder += `<li>${menus[i].name}(${menus[i].type})${menus[i].quantity}개,${totalprice}원
                            <button onclick="plus(${i})">+</button>
                            <button onclick="minus(${i})">-</button>
                            <button onclick="deleteitem(${i})">x</button></li>`;
          }
        }
        orderitem.innerHTML = resultorder;
      }

      // 3. add(): DOM을 직접 비교하지 않고 isOrdered 체크 및 수량 관리
      function add(index) {
        // 상태관리 isOrdered = false;
        if (menus[index].isOrdered == true) {
          menus[index].quantity++;
        } else {
          // 아직 주문이 되지 않은 상품임
          menus[index].isOrdered = true;
          menus[index].quantity = 1;
        }
        renderOder();
      }

      // 4. plus(): 수량 증가 후 주문 목록 전체 다시 그리기
      function plus(index) {
        menus[index].quantity++;
        renderOder();
      }

      // 5. minus(): 수량 감소 후 주문 목록 전체 다시 그리기
      function minus(index) {
        if (menus[index].quantity > 1) {
          menus[index].quantity--;
        } else {
          alert('수량은 최소 1개 이상이어야 합니다.');
        }
        renderOder();
      }

      // 6. deleteitem(): splice 대신 isOrdered를 false로 만들어 삭제 처리
      function deleteitem(index) {
        menus[index].isOrdered = false;
        menus[index].quantity = 1;
        renderOder();
      }
    </script>
  </body>
</html>
