<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배열02</title>
  </head>
  <body>
    <script>
      let ranking = ['Jason', 'Alice', 'Candy', 'Chris', 'Tom'];
      console.log(`ranking 출력 : ${ranking}`);
      console.log(ranking);

      let arrTotal = ['korea', 90, '2026-09-28'];
      console.log(arrTotal);
      // Property는 객체가 갖고 있는 '정보(상태)'이므로 호출 시 ()를 쓰지 않으며,
      //  Method는 객체가 수행할 '기능(동작)'이므로 실행을 의미하는 ()를 반드시 붙인다.

      // 1. pop(): 맨 마지막 요소를 제거하고 반환[cite: 2]
      let popped = ranking.pop(); //[cite: 2]
      console.log('pop() 반환값:', popped); // 'Tom'
      console.log('pop() 후 배열:', ranking); // ['Jason', 'Alice', 'Candy', 'Chris']

      // 2. push(new data): 맨 마지막에 새로운 데이터 추가[cite: 2]
      ranking.push('David'); //[cite: 2]
      console.log('push() 후 배열:', ranking); // ['Jason', 'Alice', 'Candy', 'Chris', 'David']

      // 3. shift(): 맨 앞 요소를 제거하고 반환[cite: 2]
      let shifted = ranking.shift(); //[cite: 2]
      console.log('shift() 반환값:', shifted); // 'Jason'
      console.log('shift() 후 배열:', ranking); // ['Alice', 'Candy', 'Chris', 'David']

      // 4. unshift(new data): 맨 앞에 새로운 데이터 추가[cite: 2]
      ranking.unshift('Emma'); //[cite: 2]
      console.log('unshift() 후 배열:', ranking); // ['Emma', 'Alice', 'Candy', 'Chris', 'David']

      // 테스트를 위해 배열 원복
      ranking = ['Jason', 'Alice', 'Candy', 'Chris', 'Tom'];

      // 5. join(연결할 문자): 요소를 지정한 문자로 연결하여 문자열 반환[cite: 2]
      let joinedString = ranking.join('-'); //[cite: 2]
      console.log('join("-") 결과:', joinedString); // 'Jason-Alice-Candy-Chris-Tom'

      // 6. reverse(): 배열 요소 순서를 뒤집음[cite: 2]
      ranking.reverse(); //[cite: 2]
      console.log('reverse() 후 배열:', ranking); // ['Tom', 'Chris', 'Candy', 'Alice', 'Jason']

      // 7. sort(): 오름차순(알파벳순) 정렬[cite: 2]
      ranking.sort(); //[cite: 2]
      console.log('sort() 후 배열:', ranking); // ['Alice', 'Candy', 'Chris', 'Jason', 'Tom']

      // 8. slice(startIndex, endIndex): 지정한 인덱스 구간(endIndex 미포함)을 잘라 새 배열 생성[cite: 2]
      // 인덱스 1부터 3 이전(인덱스 1, 2)까지 잘라냄
      let sliced = ranking.slice(1, 3); //[cite: 2]
      console.log('slice(1, 3) 결과:', sliced); // ['Candy', 'Chris']
      console.log('slice() 후 원본 배열:', ranking); // ['Alice', 'Candy', 'Chris', 'Jason', 'Tom'] (원본 유지)

      // 9. splice(startIndex, deleteCount, item1, ...): 특정 위치의 데이터 삭제 및 추가[cite: 2]
      // 인덱스 2 위치에서 1개 삭제 후 'Peter' 삽입
      let spliced = ranking.splice(2, 1, 'Peter'); //[cite: 2]
      console.log('splice() 제거된 요소:', spliced); // ['Chris']
      console.log('splice() 후 배열:', ranking); // ['Alice', 'Candy', 'Peter', 'Jason', 'Tom']

      // 10. concat(): 두 배열을 하나로 합쳐 새 배열 반환[cite: 2]
      let newRanking = ranking.concat(['Sam', 'John']); //[cite: 2]
      console.log('concat() 결과:', newRanking); // ['Alice', 'Candy', 'Peter', 'Jason', 'Tom', 'Sam', 'John']

      // 11. indexOf(): 특정 값의 인덱스 위치 반환 (없으면 -1)[cite: 2]
      let index = ranking.indexOf('Alice'); //[cite: 2]
      console.log('indexOf("Alice"):', index); // 0

      // 12. includes(): 특정 값의 존재 여부(true/false) 반환[cite: 2]
      let hasTom = ranking.includes('Tom'); //[cite: 2]
      let hasJake = ranking.includes('Jake'); //[cite: 2]
      console.log('includes("Tom"):', hasTom); // true[cite: 2]
      console.log('includes("Jake"):', hasJake); // false[cite: 2]
    </script>
  </body>
</html>
