<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>슬라이드</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }
      body {
        background-color: #f5f5f5;
      }
      .slider-wrap {
        position: relative;
        width: 600px;
        height: 350px;
        margin: 100px auto;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        overflow: hidden;
      }
      .slider img {
        width: 100%;
        height: 100%;
      }
      .btns {
        position: absolute;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        /* border: 1px solid red; */
      }
      .btns span {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: #ccc;
        cursor: pointer;
      }
      .btns span.active {
        background-color: #007bff;
        transform: scale(1.3);
      }
      .control {
        position: absolute;
        top: 10px;
        right: 10px;
        background-color: rgba(255, 255, 255, 0.8);
        padding: 5px 10px;
        border-radius: 10px;
        font-size: 14px;
        cursor: pointer;
        /* CSS 속성인 user-select: none;은 웹페이지의 글자나 텍스트를 
        마우스로 드래그(선택)하여 복사하지 못하도록 방해(차단)하는 기능입니다. */

        /* 사용하는 이유 */
        /* 버튼이나 아이콘 같은 UI 요소를 사용자가 마우스로 빠르게 더블클릭하거나 
        드래그할 때, 의도치 않게 글자가 파랗게 블록(선택) 잡히는 현상을 막아줍니다. */
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="slider-wrap">
      <div class="slider">
        <img id="photo" src="/images/pic_1.jpg" alt="슬라이드 이미지" />
      </div>
      <div class="btns">
        <span class="active"></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="control" id="togglebtn">&#x23F8; 정지</div>
    </div>

    <script>
      let photo = document.getElementById('photo');
      let btns = document.querySelectorAll('.btns span');
      let toggleBtn = document.getElementById('togglebtn');

      let current = 0;
      let total = btns.length;
      let isPlay = true;
      let timer;

      // 이미지 변경될때 마다 동그라미 순서가 자동으로이동하도록 하는 함수
      function showSlide(index) {
        photo.src = `/images/pic_${index + 1}.jpg`;

        for (let i = 0; i < total; i++) {
          btns[i].classList.remove('active');
        }
        btns[index].classList.add('active');
      }

      // 동그라미가 자동으로 이동하는 setTimeOut함수
      function startSlide() {
        timer = setInterval(() => {
          if (current === total - 1) {
            current = 0;
          } else {
            current++;
          }

          // 변경된 인덱스에 해당하는 슬라이드를 보여줌
          showSlide(current);
        }, 3000);
      }

      // 슬라이드 정지
      function stopSlide() {
        clearInterval(timer);
      }
      showSlide(current);
      startSlide();

      // 재생 정지버튼 기능
      toggleBtn.addEventListener('click', () => {
        if (isPlay) {
          // 재생 중일 때 -> 정지
          console.log('isPlay=ture', isPlay);
          stopSlide();
          toggleBtn.innerText = '▶ 재생';
          isPlay = false;
        } else {
          // 정지 중일 때 -> 재생
          console.log('isPlay=flase', isPlay);
          startSlide();
          toggleBtn.innerText = '\u23F8 정지';
          isPlay = true;
        }

        // isPlay = !isPlay;
      });
    </script>
  </body>
</html>
