<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>날짜 기초 연습문제</title>
  </head>
  <body>
    <button onclick="showYear()">1.현재 연도 출력</button>
    <button onclick="showDay()">2.오늘 요일 출력</button>
    <button onclick="showTime()">3.현재 시간 출력</button>
    <button onclick="showFutureDates()">4.하루 후, 일주일 후 날짜 출력</button>
    <button onclick="checkWeekend()">5.요일에 따라 메시지 출력</button>
    <p id="output"></p>

    <script>
      // 문제1
      function showYear() {
        const now = new Date();
        const year = now.getFullYear();
        document.getElementById('output').innerText = `올해는 ${year}년입니다.`;
      }

      // 문제2
      function showDay() {
        const now = new Date();
        const weekString = ['일', '월', '화', '수', '목', '금', '토'];
        const dayIndex = now.getDay(); // 0(일) ~ 6(토)

        document.getElementById('output').innerText =
          `오늘은 ${weekString[dayIndex]}요일입니다.`;
      }

      // 문제3
      function showTime() {
        const now = new Date();
        console.log(`현재시간 : ${now}`);
        console.log(`현재시간 : ${now.toLocaleTimeString()}`);

        // 출력 결과 -> 현재 시간: 04:24:42 (또는 16:24:42)
        // 현재 시간: 4시 30분 8초
        document.getElementById('output').innerText =
          `현재 시간: ${now.toLocaleTimeString('ko-KR', { hour12: false })}`;

        // 현재 시간: 오전 4:29:42
        document.getElementById('output').innerText =
          `현재 시간: ${now.toLocaleTimeString()}`;

        // 현재 시간: 04:29:19
        document.getElementById('output').innerText =
          `현재 시간: ${now.toLocaleTimeString('en-US', { hour12: false })}`;
      }

      //문제 4
      function showFutureDates() {
        const today = new Date();

        // 하루 후 계산
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);

        // 일주일 후 계산
        const nextWeek = new Date(today);
        nextWeek.setDate(today.getDate() + 7);

        document.getElementById('output').innerHTML =
          `하루 후: ${tomorrow.toLocaleDateString()}<br>` +
          `일주일 후: ${nextWeek.toLocaleDateString()}`;
      }

      //문제5
      function checkWeekend() {
        const now = new Date();
        const day = now.getDay(); // 0: 일요일, 6: 토요일

        if (day === 0 || day === 6) {
          document.getElementById('output').innerText = '주말이에요!';
        } else {
          document.getElementById('output').innerText = '열심히 일하는 날!';
        }
      }
    </script>
  </body>
</html>
